<!doctype html>
<html lang="en" data-bs-theme="{{ config.get('theme', 'light') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login &mdash; {{ config.get('app_name', 'MedPapers Daily') }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="{{ get_theme_url(config.get('bootstrap_theme', 'flatly')) }}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-body-secondary">
<div class="card shadow" style="width:380px">
  <div class="card-body p-4">
    <h4 class="card-title mb-1 text-center fw-bold">
      <i class="bi bi-journal-bookmark-fill me-1"></i>{{ config.get('app_name', 'MedPapers Daily') }}
    </h4>
    <p class="text-center text-muted small mb-4">Scientific literature monitoring</p>
    {% for msg in request.state.flash_messages %}
    <div class="alert alert-{{ msg.category if msg.category in ('success','danger','warning','info') else 'secondary' }} py-2">{{ msg.message }}</div>
    {% endfor %}
    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" autofocus autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
